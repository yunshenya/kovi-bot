[package]
name = "kovi-bot"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
kovi.workspace = true
model = { version = "0.1.0", path = "plugins/model" }

[workspace]
members = ["crates/yunxi-core", "plugins/model"]

[workspace.dependencies]
kovi = { version = "0.12.3", default-features = false, features = ["logger", "plugin-access-control"] }
reqwest = { version = "0.12.15", features = ["json", "rustls-tls"], default-features = false }
chrono = { version = "0.4.41", features = ["serde"] }
chrono-tz = "0.10.4"
redis = { version = "1.6", default-features = false, features = ["tokio-comp", "connection-manager", "script"] }
sqlx-core = { version = "=0.8.6", default-features = false, features = ["_rt-tokio", "_tls-rustls-ring-webpki", "json", "chrono"] }
sqlx-postgres = { version = "=0.8.6", default-features = false, features = ["json", "chrono"] }
rmcp = { version = "3.1.4", default-features = false, features = ["client", "transport-child-process"] }
scraper = "0.27.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0"
thiserror = "2.0"
tokio = { version = "1.53.1", default-features = false, features = ["sync"] }
url = "2.5.8"
uuid = { version = "1.18", features = ["serde", "v4"] }

# Line tables preserve useful backtraces while avoiding multi-gigabyte full debug info.
[profile.dev]
debug = 1
incremental = false

[profile.test]
debug = 1
incremental = false
