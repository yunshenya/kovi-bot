<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>芸汐 · 管理后台</title>
<!-- 先落主题再渲染，避免选了浅色主题的人看到一下深色的闪白。 -->
<script>
  try {
    document.documentElement.dataset.theme = localStorage.getItem('yunxi-admin-theme') || 'dark';
  } catch (_) {
    document.documentElement.dataset.theme = 'dark';
  }
</script>
<link rel="stylesheet" href="/assets/app.css">
</head>
<body>

<!-- ───────────────────────────── 登录 ───────────────────────────── -->
<div id="login-view" class="login-wrap" hidden>
  <div class="login-aurora" aria-hidden="true">
    <span class="blob b1"></span><span class="blob b2"></span><span class="blob b3"></span>
  </div>
  <div class="login-grid" aria-hidden="true"></div>
  <button id="login-theme" class="login-theme" type="button" title="切换深浅色">◐</button>

  <form id="login-form" class="login-card" autocomplete="off">
    <div class="login-mark">
      <span class="login-mark-glyph">汐</span>
      <span class="login-mark-ring"></span>
    </div>
    <h1>欢迎回来</h1>
    <p class="login-sub"><span id="login-greeting">我是芸汐</span>，先证明是你本人。</p>

    <label class="login-field">
      <span class="login-label">访问 Token</span>
      <span class="login-input-wrap">
        <input id="login-token" class="input" type="password" placeholder="粘贴启动日志里的那串字符"
               autocomplete="off" name="yunxi-admin-token" spellcheck="false" required>
        <button id="login-reveal" class="login-reveal" type="button" title="显示 / 隐藏">👁</button>
      </span>
    </label>

    <button id="login-submit" type="submit" class="btn primary block login-submit">
      <span class="login-submit-text">登 录</span>
      <span class="login-spinner" hidden></span>
    </button>

    <p id="login-error" class="login-error" hidden></p>

    <details class="login-help">
      <summary>找不到 Token？</summary>
      <ul>
        <li>看服务端启动日志：<code>journalctl -u kovi-bot | grep Token</code></li>
        <li>或读运行时目录的 <code>.yunxi-admin-token</code>（本机跑就是工作目录）</li>
        <li>也可以固定下来：在 <code>bot.conf.toml</code> 的 <code>[admin]</code> 里把
            <code>token_env</code> 指向一个环境变量</li>
      </ul>
    </details>
  </form>

  <p class="login-foot">只监听回环地址 · 登录状态存在会话 Cookie 里</p>
</div>

<!-- ───────────────────────────── 主界面 ───────────────────────────── -->
<div id="app-view" class="app" hidden>
  <aside class="sidebar">
    <div class="brand">
      <div class="brand-mark">汐</div>
      <div class="brand-text">
        <strong>芸汐</strong>
        <span id="brand-revision">管理后台</span>
      </div>
    </div>
    <nav class="nav">
      <!-- 窄屏只留图标：文字包在 .nav-label 里才藏得掉（裸文本节点没有选择器
           能命中，早先媒体查询写的 span:not(.nav-icon) 从来没生效过）。藏掉
           文字后按钮的可访问名只剩图标，所以每个都补 aria-label。 -->
      <button class="nav-item active" data-page="overview" aria-label="概览" title="概览"><span class="nav-icon">◈</span><span class="nav-label">概览</span></button>
      <button class="nav-item" data-page="config" aria-label="配置" title="配置"><span class="nav-icon">⚙</span><span class="nav-label">配置</span></button>
      <button class="nav-item" data-page="memory" aria-label="记忆" title="记忆"><span class="nav-icon">❖</span><span class="nav-label">记忆</span></button>
      <button class="nav-item" data-page="stickers" aria-label="表情包" title="表情包"><span class="nav-icon">☺</span><span class="nav-label">表情包</span></button>
      <button class="nav-item" data-page="annotation" aria-label="标注" title="标注"><span class="nav-icon">✎</span><span class="nav-label">标注</span></button>
      <button class="nav-item" data-page="system" aria-label="系统" title="系统"><span class="nav-icon">▤</span><span class="nav-label">系统</span></button>
    </nav>
    <div class="sidebar-foot">
      <button id="theme-toggle" class="nav-item subtle" aria-label="切换深浅色" title="切换深浅色"><span class="nav-icon">◐</span><span id="theme-label" class="nav-label">浅色</span></button>
      <button id="logout" class="nav-item subtle" aria-label="退出登录" title="退出登录"><span class="nav-icon">⏻</span><span class="nav-label">退出登录</span></button>
      <div class="sidebar-note">仅监听回环地址，登录态保存在会话 Cookie 中。</div>
    </div>
  </aside>

  <main class="main">
    <header class="topbar">
      <div class="topbar-title">
        <h2 id="page-title">概览</h2>
        <p id="page-subtitle"></p>
      </div>
      <div class="topbar-actions">
        <span id="health-pill" class="pill">连接中…</span>
        <button id="refresh" class="btn ghost">刷新</button>
      </div>
    </header>

    <section id="page-overview" class="page"></section>
    <section id="page-config" class="page" hidden></section>
    <section id="page-memory" class="page" hidden></section>
    <section id="page-stickers" class="page" hidden></section>
    <section id="page-annotation" class="page" hidden></section>
    <section id="page-system" class="page" hidden></section>
  </main>
</div>

<div id="toast-stack" class="toast-stack"></div>

<!-- 通用弹窗：原始 TOML、备份、记录详情里需要放大展示的内容 -->
<div id="modal" class="modal" hidden>
  <div class="modal-card">
    <header class="modal-head">
      <h3 id="modal-title">标题</h3>
      <div class="modal-head-actions">
        <span id="modal-note" class="modal-note"></span>
        <button id="modal-close" class="btn ghost small">关闭</button>
      </div>
    </header>
    <div id="modal-body" class="modal-body"></div>
    <footer id="modal-foot" class="modal-foot" hidden></footer>
  </div>
</div>

<script src="/assets/app.js"></script>
</body>
</html>
