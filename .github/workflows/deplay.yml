name: Deploy kovi-bot

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kovi-bot-production
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  DEPLOY_HOST: 139.155.156.152
  DEPLOY_USER: ubuntu
  REMOTE_APP_DIR: /home/ubuntu/kovi-bot

jobs:
  test-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: kovi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d kovi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      CARGO_TERM_COLOR: always
      DATABASE_URL: postgresql://postgres:integration-test@127.0.0.1:5432/kovi_test
      KOVI_RUN_POSTGRES_TEST: "1"

    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6

      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --locked -- -D warnings

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Build release binary
        run: cargo build --release --locked

      - name: Install deployment tools
        run: |
          # 网络异常时快速失败，避免后续发布任务无限排队。
          sudo timeout 180s apt-get \
            -o Acquire::Retries=2 \
            -o Acquire::http::Timeout=30 \
            -o Acquire::https::Timeout=30 \
            update
          sudo timeout 180s apt-get install --yes --no-install-recommends sshpass

      - name: Configure SSH host verification
        run: |
          install -d -m 700 ~/.ssh
          server_key="$(ssh-keyscan -t ed25519 "$DEPLOY_HOST" 2>/dev/null)"
          fingerprint="$(printf '%s\n' "$server_key" | ssh-keygen -lf - | awk '{print $2}')"
          test "$fingerprint" = "SHA256:B93UXbgWbAT+PDCy7/0WjBK1Gw4SQYh5lDITj9E64wQ"
          printf '%s\n' "$server_key" > ~/.ssh/known_hosts
          chmod 600 ~/.ssh/known_hosts

      - name: Validate deployment secrets
        env:
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          NAPCAT_ACCESS_TOKEN: ${{ secrets.NAPCAT_ACCESS_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
        run: |
          test -n "$DEPLOY_PASSWORD" || { echo "Missing DEPLOY_PASSWORD"; exit 1; }
          test -n "$OPENAI_API_KEY" || { echo "Missing OPENAI_API_KEY"; exit 1; }
          test -n "$NAPCAT_ACCESS_TOKEN" || { echo "Missing NAPCAT_ACCESS_TOKEN"; exit 1; }
          test -n "$POSTGRES_PASSWORD" || { echo "Missing POSTGRES_PASSWORD"; exit 1; }

      - name: Upload application
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          timeout 60s sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "mkdir -p '$REMOTE_APP_DIR'"
          timeout 180s sshpass -e scp \
            target/release/kovi-bot \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_APP_DIR/kovi-bot.new"
          timeout 60s sshpass -e scp \
            bot.conf.toml kovi.plugin.toml \
            "$DEPLOY_USER@$DEPLOY_HOST:$REMOTE_APP_DIR/"

      - name: Write protected runtime configuration
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          BOT_API_TOKEN: ${{ secrets.BOT_API_TOKEN }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          VISION_API_TOKEN: ${{ secrets.VISION_API_TOKEN }}
          NAPCAT_ACCESS_TOKEN: ${{ secrets.NAPCAT_ACCESS_TOKEN }}
          POSTGRES_PASSWORD: ${{ secrets.POSTGRES_PASSWORD }}
          BRAVE_SEARCH_API_KEY: ${{ secrets.BRAVE_SEARCH_API_KEY }}
          REDIS_URL: ${{ secrets.REDIS_URL }}
        run: |
          {
            printf 'BOT_API_TOKEN=%s\n' "$BOT_API_TOKEN"
            printf 'OPENAI_API_KEY=%s\n' "$OPENAI_API_KEY"
            printf 'VISION_API_TOKEN=%s\n' "$VISION_API_TOKEN"
            printf 'BRAVE_SEARCH_API_KEY=%s\n' "$BRAVE_SEARCH_API_KEY"
            printf '%s\n' 'VISION_API_URL=https://codex666ai.com'
            printf '%s\n' 'VISION_WIRE_API=responses'
            printf '%s\n' 'VISION_MODEL_NAME=gpt-5.5'
            printf '%s\n' 'VISION_ACTOR_AUTHORIZATION=local-image-extension'
            printf '%s\n' 'VISION_REQUIRES_AUTH=false'
            printf 'DATABASE_URL=postgresql://postgres:%s@127.0.0.1:5432/postgres\n' "$POSTGRES_PASSWORD"
            printf 'REDIS_URL=%s\n' "${REDIS_URL:-redis://127.0.0.1:6379/0}"
            printf '%s\n' 'REDIS_KEY_PREFIX=kovi'
          } | \
            sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '$REMOTE_APP_DIR/.env'"

          {
            printf '%s\n' '[config]'
            printf '%s\n' 'main_admin = 3052405886'
            printf '%s\n' 'admins = []'
            printf '%s\n\n' 'debug = false'
            printf '%s\n' '[server]'
            printf '%s\n' 'host = "127.0.0.1"'
            printf '%s\n' 'port = 3001'
            printf 'access_token = "%s"\n' "$NAPCAT_ACCESS_TOKEN"
            printf '%s\n' 'secure = false'
          } | sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "umask 077; cat > '$REMOTE_APP_DIR/kovi.conf.toml'"

      - name: Install and restart systemd service
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
          DEPLOY_PASSWORD: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "cat > '$REMOTE_APP_DIR/kovi.service'" <<'EOF'
          [Unit]
          Description=Kovi QQ Bot
          Wants=network-online.target postgresql.service redis-server.service
          After=network-online.target postgresql.service redis-server.service

          [Service]
          Type=simple
          User=ubuntu
          WorkingDirectory=/home/ubuntu/kovi-bot
          EnvironmentFile=/home/ubuntu/kovi-bot/.env
          ExecStart=/home/ubuntu/kovi-bot/kovi-bot
          Restart=always
          RestartSec=5
          UMask=0077
          NoNewPrivileges=true
          PrivateTmp=true
          PrivateDevices=true
          ProtectSystem=strict
          ProtectHome=read-only
          ReadWritePaths=/home/ubuntu/kovi-bot
          ProtectKernelTunables=true
          ProtectKernelModules=true
          ProtectKernelLogs=true
          ProtectControlGroups=true
          ProtectClock=true
          RestrictSUIDSGID=true
          RestrictRealtime=true
          RestrictNamespaces=true
          LockPersonality=true
          CapabilityBoundingSet=
          AmbientCapabilities=
          RestrictAddressFamilies=AF_UNIX AF_INET AF_INET6
          SystemCallArchitectures=native

          [Install]
          WantedBy=multi-user.target
          EOF

          {
            printf '%s\n' "$DEPLOY_PASSWORD"
            cat <<'EOF'
          set -e
          install -m 0644 /home/ubuntu/kovi-bot/kovi.service /etc/systemd/system/kovi.service
          if test -x /home/ubuntu/kovi-bot/kovi-bot; then
            cp -a /home/ubuntu/kovi-bot/kovi-bot /home/ubuntu/kovi-bot/kovi-bot.previous
          fi
          chown ubuntu:ubuntu /home/ubuntu/kovi-bot/kovi-bot.new
          chmod 0755 /home/ubuntu/kovi-bot/kovi-bot.new
          mv -f /home/ubuntu/kovi-bot/kovi-bot.new /home/ubuntu/kovi-bot/kovi-bot
          systemctl daemon-reload
          systemctl enable kovi.service
          deployment_started_at="$(date --iso-8601=seconds)"
          ready=0
          if systemctl restart kovi.service; then
            for attempt in $(seq 1 20); do
              if systemctl is-active --quiet kovi.service && \
                 journalctl -u kovi.service --since "$deployment_started_at" --no-pager | \
                   grep -q 'PostgreSQL 表情包记忆库已就绪'; then
                ready=1
                break
              fi
              sleep 1
            done
          fi
          if test "$ready" -ne 1; then
            if test -x /home/ubuntu/kovi-bot/kovi-bot.previous; then
              mv -f /home/ubuntu/kovi-bot/kovi-bot.previous /home/ubuntu/kovi-bot/kovi-bot
              systemctl restart kovi.service
            fi
            exit 1
          fi
          EOF
          } | sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" "sudo -S bash -s"

      - name: Show service status
        if: always()
        env:
          SSHPASS: ${{ secrets.DEPLOY_PASSWORD }}
        run: |
          sshpass -e ssh "$DEPLOY_USER@$DEPLOY_HOST" \
            "systemctl --no-pager --full status kovi.service" || true
