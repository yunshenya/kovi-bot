name: CI

on:
  pull_request:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: "0"

jobs:
  rust:
    name: Format, lint, and test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kovi_test
          POSTGRES_PASSWORD: integration-test
          POSTGRES_DB: kovi_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kovi_test -d kovi_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1
          components: rustfmt, clippy

      - name: Cache Rust build
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Check formatting
        run: cargo fmt --all -- --check

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets --all-features --locked -- -D warnings

      - name: Verify Yunxi platform dependency boundaries
        shell: bash
        run: |
          for package in yunxi-core yunxi-cli; do
            forbidden="$({
              cargo tree -p "$package" --edges normal --prefix none --format '{p}' |
                awk '{ name = tolower($1); if (name ~ /^(kovi|onebot|sqlx|postgres|tokio-postgres|sea-orm|diesel)(-|$)/) print }'
            })"
            if [[ -n "$forbidden" ]]; then
              echo "$package contains forbidden platform or storage dependencies:"
              echo "$forbidden"
              exit 1
            fi
          done

      - name: Run tests
        run: cargo test --workspace --all-targets --locked

      - name: Run SSRF boundary tests
        run: >-
          cargo test -p model --lib --locked
          image_security::tests::rejects_non_public_or_ambiguous_image_urls -- --exact

      - name: Run deterministic concurrency tests
        run: cargo test -p model --features integration-tests --test boundary_integration --locked

      - name: Run black-box Redis integration test
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
        run: >-
          cargo test -p model --features integration-tests --test boundary_integration --locked
          redis_runtime_store_round_trips_through_the_black_box_api -- --ignored --exact

      - name: Run PostgreSQL integration tests
        env:
          DATABASE_URL: postgresql://kovi_test:integration-test@127.0.0.1:5432/kovi_test
        run: >-
          cargo test -p model --lib --locked
          memory::tests::normalized_postgres_storage_round_trips -- --ignored --exact

      - name: Run Yunxi identity mapping integration test
        env:
          DATABASE_URL: postgresql://kovi_test:integration-test@127.0.0.1:5432/kovi_test
        run: >-
          cargo test -p model --lib --locked
          yunxi::identity_store::tests::postgres_identity_mapping_is_stable_and_race_safe -- --ignored --exact

      - name: Run Yunxi Core store integration tests
        env:
          DATABASE_URL: postgresql://kovi_test:integration-test@127.0.0.1:5432/kovi_test
        shell: bash
        run: |
          for test in \
            yunxi::affect_store::tests::postgres_affect_store_round_trips_state \
            yunxi::relation_store::tests::postgres_relation_store_reads_optional_state \
            yunxi::goal_store::tests::postgres_goal_store_round_trips_crud \
            yunxi::memory_store::tests::postgres_memory_v2_round_trips_person_and_conversation_scopes \
            yunxi::memory_store::tests::postgres_cleanup_uses_migration_proof_when_identity_mapping_is_gone \
            memory::tests::postgres_direct_conversation_delete_removes_only_exact_contexts \
            yunxi::mind_store::tests::postgres_mind_store_contracts_are_durable_bounded_and_atomic \
            yunxi::mind_store::tests::postgres_episode_put_compares_under_meta_lock_after_delete_replace \
            yunxi::open_loop_store::tests::postgres_global_due_defer_removes_the_schedule \
            yunxi::identity_store::tests::postgres_person_domain_deletion_removes_core_data_transactionally \
            yunxi::identity_store::tests::postgres_missing_person_deletion_rejects_another_person_direct_member \
            yunxi::identity_store::tests::postgres_person_import_waits_for_owner_lock \
            yunxi::identity_store::tests::postgres_person_deletion_blocks_then_rejects_missing_direct_route_creation \
            yunxi::identity_store::tests::postgres_person_domain_deletion_purges_only_attributable_delivery_rows \
            yunxi::identity_store::tests::postgres_person_domain_deletion_serializes_concurrent_owner_writes \
            yunxi::identity_store::tests::postgres_group_domain_deletion_removes_canonical_and_delivery_rows \
            yunxi::identity_store::tests::postgres_person_export_import_and_unlink_round_trip \
            yunxi::identity_store::tests::postgres_qq_unlink_purges_private_legacy_rows_before_identity_reuse \
            yunxi::identity_store::tests::postgres_person_import_rejects_identity_and_memory_conflicts_transactionally \
            yunxi::identity_store::tests::postgres_person_export_fails_closed_above_collection_limits \
            yunxi::delivery_ledger::tests::postgres_restart_blocks_a_committed_delivery \
            yunxi::delivery_ledger::tests::postgres_reused_key_with_different_envelope_fails_closed \
            yunxi::delivery_ledger::tests::postgres_definite_failure_retries_only_the_same_envelope \
            yunxi::delivery_ledger::tests::postgres_concurrent_identical_key_has_one_acquirer_and_one_replay_barrier \
            yunxi::delivery_ledger::tests::postgres_concurrent_changed_envelopes_have_one_acquirer_and_one_conflict \
            yunxi::delivery_ledger::tests::postgres_restart_blocks_an_unknown_delivery \
            yunxi::delivery_ledger::tests::postgres_owner_deletion_blocks_then_rejects_a_delivery_commit \
            yunxi::delivery_ledger::tests::postgres_conversation_deletion_blocks_then_rejects_a_send_commit \
            yunxi::memory_migration::tests::postgres_backfill_is_idempotent_and_rollback_keeps_legacy_rows
          do
            cargo test -p model --lib --locked "$test" -- --ignored --exact
          done

      - name: Run reminder claim integration test
        env:
          DATABASE_URL: postgresql://kovi_test:integration-test@127.0.0.1:5432/kovi_test
        shell: bash
        run: |
          for test in \
            reminders::tests::postgres_claim_is_atomic_across_concurrent_workers \
            reminders::tests::postgres_restart_settles_expired_sending_without_replay
          do
            cargo test -p model --lib --locked "$test" -- --ignored --exact
          done

      - name: Run agent goal idempotency integration test
        env:
          DATABASE_URL: postgresql://kovi_test:integration-test@127.0.0.1:5432/kovi_test
        run: >-
          cargo test -p model --lib --locked
          agent_runtime::tests::postgres_goal_reservation_is_atomic_and_idempotent -- --ignored --exact

      - name: Run agent task concurrency integration test
        env:
          DATABASE_URL: postgresql://kovi_test:integration-test@127.0.0.1:5432/kovi_test
        shell: bash
        run: |
          for test in \
            agent_tasks::tests::postgres_task_reservation_is_atomic_and_event_recording_is_idempotent \
            agent_tasks::tests::postgres_report_send_gate_is_fail_closed_on_failure_and_restart
          do
            cargo test -p model --lib --locked "$test" -- --ignored --exact
          done

      - name: Run agent run concurrency integration test
        env:
          DATABASE_URL: postgresql://kovi_test:integration-test@127.0.0.1:5432/kovi_test
        run: >-
          cargo test -p model --lib --locked
          agent_runs::tests::postgres_run_creation_and_claim_are_atomic -- --ignored --exact

      - name: Run Redis integration tests
        env:
          REDIS_URL: redis://127.0.0.1:6379/15
        run: >-
          cargo test -p model --lib --locked
          redis_store::tests::redis_runtime_store_round_trips -- --ignored --exact

      - name: Verify generated build output is bounded
        run: |
          test "$(du -sm target | awk '{print $1}')" -lt 16384

      - name: Build release binary
        run: cargo build --release --locked

  supply-chain:
    name: Dependencies and secrets
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install pinned Rust toolchain
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c
        with:
          toolchain: 1.97.1

      - name: Cache Rust tools
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2

      - name: Install security tools
        run: |
          cargo install cargo-audit --locked --version 0.22.2
          cargo install cargo-deny --locked --version 0.20.2
          cargo install ripsecrets --locked --version 0.1.11

      - name: Scan tracked files for secrets
        run: ripsecrets --strict-ignore .

      - name: Check advisories
        # paste is transitive from candle-core/tokenizers; see deny.toml for the review rationale.
        run: cargo audit --deny warnings --ignore RUSTSEC-2024-0436

      - name: Check licenses, sources, and dependency policy
        run: cargo deny --all-features check
