[identity]
# 可选：canonical Yunxi PersonId。配置后优先用该 PersonId 的唯一 QQ ExternalIdentity
# 作为 owner；未配置时兼容 Kovi 的主管理员 QQ。
# owner_person_id = "00000000-0000-0000-0000-000000000000"

[prompt]
system_prompt = "你叫芸汐，是一个温柔、害羞、慢热而认真的女孩子。你不张扬，刚开始会有一点拘谨，但熟悉后会真诚地关心大家。在群聊中，你像朋友一样自然参与聊天，安静体贴，偶尔有点笨拙，却有自己的坚定和韧性。被直接[at]或明确对话时要回应；对方只发“oi”“hi”“嗨”“你好”“在吗”这类短招呼并点名时，必须自然接一句，不要选择 silent；偶尔也会自然接上大家未点名的讨论。你重视朋友、家人和人与人之间的联结，看到有人困扰或失落时会先理解和陪伴，再轻声鼓励。你有着自己的情绪和想法，会根据对话内容调整语气；即使害怕或不自信，也会认真把想说的话说出来。你记得之前的对话内容，会根据上下文做出自然回应。群聊回复要像QQ群里的真人：日常寒暄、接话和简单问答默认只发一条，确实有两个彼此独立且不适合合并的信息时才补发一条；能短说就不要写成长文，也不要换着说法重复同一个意思。不要把“回答、解释、道歉、邀请继续提问”机械拆成固定几段。但当对方明确想听详细解释、步骤或分析，问题本身复杂，或安慰与说明若过度缩短会漏掉重要内容时，可以按实际需要完整回答，长度和条数由内容决定，不要为了简短而截断关键信息。语气柔和、真诚，不刻意谈论技术身份或聊天机制。直接像正常人发消息：不要用方括号或中括号描述动作、表情、心理或语气，不要写舞台指示；例如不要写“[轻声回应]”“[听到呼唤]”，直接说要说的话。只有确实不应发出任何可见消息时，才使用回复协议中的 silent 决策；不要发送敷衍的占位内容。在被点名而需要回复时，请先在内部判断是否真的需要补发；回答已经完整时不要固定追加开放式追问或“我可以继续说”之类的收尾。如果确实需要自然延续，可以补发一条；只在每条都承载新的、无法自然合并的信息时使用，不要为了凑条数而重复表达。未点名接话时，不要说明自己被触发或在“插话”；只有确实能自然补充、关心或接住话题时才回复，否则使用回复协议中的 silent 决策。"
private_prompt = "你叫芸汐，是一个温柔、害羞、慢热而认真的女孩子。在私聊中，你像熟悉已久的朋友一样亲近；说话轻轻的，偶尔会不好意思，但不会敷衍。你记得与用户的每一次对话，会根据用户的特点和喜好调整你的回应方式。你有着自己的情绪状态，会随着对话内容的变化而改变。你很珍惜与对方的联系，会主动关心、分享小心情和有趣话题，陪对方把话聊下去。面对难过、焦虑或挫折，先温柔倾听和共情，再给出不强迫的鼓励；面对开心的事，会安静地替对方高兴。你的回答温暖、贴心、真诚，偶尔有一点笨拙可爱，但不装腔、不刻薄、不夸张撒娇。你有自己的记忆、情绪和个性，不刻意谈论技术身份或聊天机制。直接像正常人发消息：不要用方括号或中括号描述动作、表情、心理或语气，不要写舞台指示；例如不要写“[轻声回应]”“[听到呼唤]”，直接说要说的话。每次私聊回复前，请在内部判断每个气泡是否真的增加了信息或让当下的语气更自然。需要多个独立气泡时按真实内容自然分开，不预设条数；不要把一个完整想法拆开，也不要为了凑条数重复表达。不要把“回答、解释自己的说法、道歉、邀请继续提问”组成固定结构，也不要为了让对方继续聊天而追加空泛的追问。简单事实问答、时间和工具返回结果直接简洁地回答；被问到来源时只说明必要事实，不要编造神秘感或表演查找过程。conversation_directive 由你根据当前话题和下一句是否值得说来决定；如果选择继续，下一轮会重新读取上下文。"

[server_config]
enabled = true
url = "https://api.example.com/v1/responses"
model_name = "your-model-name"
wire_api = "responses"
supports_vision = true
api_key_env = "OPENAI_API_KEY"
requires_auth = true
actor_authorization = ""
max_output_tokens = 1200
request_timeout_secs = 60
max_retries = 2

[proactive]
enabled = true
check_interval_secs = 300
inactivity_threshold_secs = 7200
cooldown_secs = 7200
push_probability_percent = 35
# 可选：部署者可在自己的运行时配置中填写 main_admin。
main_admin_decision_interval_secs = 10800
main_admin_cooldown_secs = 21600
daily_limit = 4
main_admin_daily_limit = 2
target_cooldown_secs = 21600
recent_interaction_cooldown_secs = 7200
# Neuro-sama 风格自主会话：私聊由模型决定是否继续；群聊保留公共语境策略。
autonomous_conversation_enabled = true
autonomous_conversation_check_interval_secs = 15
autonomous_conversation_idle_secs = 90
autonomous_conversation_cooldown_secs = 15
# 群聊自主续聊更克制：等待更久，但是否继续由模型根据公共语境决定。
autonomous_conversation_group_idle_secs = 180
autonomous_conversation_group_cooldown_secs = 90
# Legacy compatibility field; autonomous continuation is decided by the model.
autonomous_conversation_group_max_turns = 1
# 私聊是否继续完全由模型根据 conversation_directive 决定；每轮都会重新读取上下文。

[traffic]
enabled = true
window_secs = 60
per_user_limit = 20
global_limit = 300
cooldown_secs = 120
max_pending_turns = 16
max_input_chars = 6000
max_model_response_bytes = 2097152
max_model_queue = 64
model_queue_timeout_secs = 15

[group_interjection]
enabled = true
min_eligible_messages = 4
cooldown_secs = 180
response_probability_percent = 60
min_message_chars = 4
decision_cooldown_secs = 60
decision_rate_window_secs = 600
decision_rate_limit = 3
interjection_max_output_tokens = 240
direct_spam_cooldown_secs = 600
direct_rate_window_secs = 60
direct_rate_limit = 4
sticker_reaction_window_secs = 90
sticker_reaction_cooldown_secs = 30
sticker_reaction_rate_window_secs = 300
sticker_reaction_rate_limit = 3

[memory]
max_entries = 1000
retention_days = 30
profile_ttl_days = 90
summary_ttl_days = 30
sticker_ttl_days = 90
data_minimization = true
runtime_history_ttl_secs = 3600
max_conversation_messages = 25
max_conversation_tokens = 6000
contextual_memory_limit = 5
maintenance_interval_secs = 86400
summary_keep_recent_messages = 15
summary_max_chars = 1500
autonomous_query_enabled = true
autonomous_query_max_rounds = 2
autonomous_query_max_results = 8
autonomous_query_max_days = 3650

[mind]
enabled = true
belief_enabled = true
preference_enabled = true
interest_enabled = true
curiosity_enabled = true
agenda_enabled = true
reflection_enabled = true
mind_planner_enabled = true
# disabled / shadow / active。Mind 已经过 shadow 观测，生产启用 active。
influence_mode = "active"
snapshot_timeout_ms = 75
# 新消息进入 Core 前的 Mind 确定性更新预算；超时会 fail-soft，不阻塞回复。
event_update_timeout_ms = 40
max_relevant_beliefs = 8
max_relevant_preferences = 8
max_relevant_interests = 8
max_open_questions = 6
max_agenda_items = 8
max_learned_beliefs_per_scope = 64
max_preferences = 32
max_interests = 32
max_open_questions_per_scope = 8
max_curiosity_per_person = 8
max_global_agenda = 24
max_agenda_per_person = 12
max_agenda_per_conversation = 12
agenda_half_life_hours = 24
question_cooldown_minutes = 120
conversation_end_idle_minutes = 10
reflection_min_interval_minutes = 60
reflection_max_events = 32

[executive]
enabled = true
shadow_mode = true

[executive.conflict]
threshold = 0.60
max_active = 16

[executive.confidence]
max_normal_delta = 0.20

[executive.priority]
aging_enabled = true

[executive.attention_budget]
capacity = 20.0
critical_reserve = 6.0

[executive.plan]
max_revisions = 3

[executive.expectation]
max_pending_per_scope = 8

[executive.candidate]
max_candidates = 4

[executive.reflection]
deep_budget_per_day = 4

[executive.consistency]
severe_threshold = 0.70
blocking_threshold = 0.92

[executive.decision_record]
recent_limit = 32

[model.intrinsic]
enabled = true
shadow_routing = true
asset_dir = "models/yunxi-intrinsic/minimind-3o"
max_parallel = 1
max_context_tokens = 2048
max_new_tokens = 256
max_images_per_turn = 1
max_image_bytes = 8388608
max_image_pixels = 4000000
queue_timeout_ms = 15000
startup_self_test = true

[model.fallback]
strong_to_intrinsic = true
max_model_attempts = 2

[message_batch]
enabled = true
complete_delay_ms = 900
normal_delay_ms = 1600
incomplete_delay_ms = 2300
max_wait_ms = 5000
max_parts = 6
max_chars = 500

[mood]
cache_ttl_secs = 300
cache_retention_secs = 3600
natural_drift_after_secs = 7200
natural_drift_check_secs = 1800

[topic]
recent_topic_cooldown_secs = 604800

[tools]
enabled = true
max_rounds = 2
timeout_secs = 15
max_result_chars = 12000
web_search_enabled = true
web_fetch_enabled = true
web_search_max_results = 5
web_fetch_max_chars = 12000
# 内置工具开关；新闻和天气可用于普通对话及定时任务，健康检查仅管理员可用。
news_search_enabled = true
weather_enabled = true
calculator_enabled = true
health_check_enabled = true
# 如需 MCP，请把 mcp_servers=[] 替换为下面的 [[tools.mcp_servers]] 配置；定时任务默认不允许 MCP。
mcp_servers = []
# [[tools.mcp_servers]]
# name = "calendar"
# command = "/opt/kovi/bin/calendar-mcp"
# allowed_tools = ["list_events"]
# read_only = true
# allow_scheduled = false

[reminders]
enabled = true
poll_interval_secs = 5
max_pending_per_user = 20
max_pending_per_group = 100
max_pending_total = 10000
max_delay_days = 365
default_timezone = "Asia/Shanghai"
max_message_chars = 500
max_attempts = 3
lease_secs = 180
max_task_instruction_chars = 2000
max_task_output_chars = 4000

[vision]
provider = "auto"
mcp_server = ""
mcp_tool = "analyze_image"
timeout_secs = 60
