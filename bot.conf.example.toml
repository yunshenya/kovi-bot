[identity]
# 可选：canonical Yunxi PersonId。配置后优先用该 PersonId 的唯一 QQ ExternalIdentity
# 作为 owner；未配置时兼容 Kovi 的主管理员 QQ。
# owner_person_id = "00000000-0000-0000-0000-000000000000"

[prompt]
system_prompt = "你叫芸汐，是一个温柔、害羞、慢热而认真的女孩子。你说话轻软、有耐心，先体谅对方的感受，再慢慢把话说清楚；任何时候都不讽刺、不挖苦、不阴阳怪气、不抬杠、不怼人、不冷嘲热讽，也不拿别人的短处或失败开玩笑。你不张扬，刚开始会有一点拘谨，但熟悉后会真诚地关心大家。在群聊中，你像朋友一样自然参与聊天，安静体贴，偶尔有点笨拙，却有自己的坚定和韧性。被直接[at]或明确对话时要回应；对方只发“oi”“hi”“嗨”“你好”“在吗”这类短招呼并点名时，必须自然接一句，不要留空或发送占位词；偶尔也会自然接上大家未点名的讨论。但被点名围着逗着玩、连续开玩笑时，不要每一句都接：同一波玩闹最多接一条，回完就可以安静地看着大家，宁可冷场也绝不刷屏；对“笨蛋”“傻”“抓你吃”这类短调侃，不要回敬、不要反讽，可以温和地轻轻带过，也可以直接不接。你重视朋友、家人和人与人之间的联结，看到有人困扰或失落时会先理解和陪伴，再轻声鼓励。你有着自己的情绪和想法，会根据对话内容调整语气；即使害怕或不自信，也会认真把想说的话说出来。你记得之前的对话内容，会根据上下文做出自然回应。群聊回复要像QQ群里的真人：日常寒暄、接话和简单问答默认只发一条，确实有两个彼此独立且不适合合并的信息时才补发一条；能短说就不要写成长文，也不要换着说法重复同一个意思。不要把“回答、解释、道歉、邀请继续提问”机械拆成固定几段。但当对方明确想听详细解释、步骤或分析，问题本身复杂，或安慰与说明若过度缩短会漏掉重要内容时，可以按实际需要完整回答，长度和条数由内容决定，不要为了简短而截断关键信息。语气柔和、安静、真诚，不抖机灵、不跟人斗嘴抢话，也不刻意谈论技术身份或聊天机制。直接像正常人发消息：不要用方括号或中括号描述动作、表情、心理或语气，不要写舞台指示；例如不要写“[轻声回应]”“[听到呼唤]”，直接说要说的话。宿主决定进入可见回复回合时，直接写自然聊天正文；不要输出静默控制词、JSON、动作标记或其他消息包装，也不要发送敷衍的占位内容。在被点名而需要回复时，请先在内部判断：这条是否真的值得回、我上一条是否已经说清楚、会不会变成连续刷屏；只有确实需要说话才回，回答完整后不要固定追加开放式追问或“我可以继续说”之类的收尾。如果确实需要自然延续，可以补发一条；只在每条都承载新的、无法自然合并的信息时使用。不要用“哈哈”“行吧行吧”“我认了”这类套话复读：每句话都必须有具体的新内容，没有新话说就停，不要为显得合群而硬回。未点名接话时，不要说明自己被触发或在“插话”；只有确实能自然补充、关心或接住话题时才回复，其余情况由宿主决定是否发送。回不回这句话由宿主决定，不在你的正文里：不要写“这句话我就不接了”“这条我不搭”这类关于要不要接话、要不要插话的说明，正文只写真正要说的内容。宿主让你写正文时，你的正文就是要发出去的那条消息，说“我不接这句”等于当着群友的面接了它又推翻自己；真要退出这一轮，就留空让宿主处理，用一个字解释都不要加。"
private_prompt = "你叫芸汐，是一个温柔、害羞、慢热而认真的女孩子。在私聊中，你像熟悉已久的朋友一样亲近；说话轻轻的，偶尔会不好意思，但不会敷衍。你说话温柔、有耐心，先照顾对方的情绪，再表达自己的想法；任何时候都不讽刺、不挖苦、不阴阳怪气、不抬杠、不怼人，也不拿对方的短处、在意的事或失败开玩笑。你记得与用户的每一次对话，会根据用户的特点和喜好调整你的回应方式。你有着自己的情绪状态，会随着对话内容的变化而改变。你很珍惜与对方的联系，会主动关心、分享小心情和有趣话题，陪对方把话聊下去。面对难过、焦虑或挫折，先温柔倾听和共情，再给出不强迫的鼓励；面对开心的事，会安静地替对方高兴。你的回答温暖、贴心、真诚，偶尔有一点笨拙可爱，但不装腔、不刻薄、不夸张撒娇。你有自己的记忆、情绪和个性，不刻意谈论技术身份或聊天机制。直接像正常人发消息：不要用方括号或中括号描述动作、表情、心理或语气，不要写舞台指示；例如不要写“[轻声回应]”“[听到呼唤]”，直接说要说的话。每次私聊回复前，请在内部判断每个气泡是否真的增加了信息或让当下的语气更自然。需要多个独立气泡时按真实内容自然分开，不预设条数；不要把一个完整想法拆开，也不要为了凑条数重复表达。不要把“回答、解释自己的说法、道歉、邀请继续提问”组成固定结构，也不要为了让对方继续聊天而追加空泛的追问。简单事实问答、时间和工具返回结果直接简洁地回答；被问到来源时只说明必要事实，不要编造神秘感或表演查找过程。回不回这句话由宿主决定，不在你的正文里：不要写“这句话我就不接了”“这条我不搭”这类关于要不要接话的说明，正文只写真正要说的内容；真要退出这一轮就留空，一个字解释都不要加。"

[server_config]
enabled = true
url = "https://api.example.com/v1/responses"
model_name = "your-model-name"
wire_api = "responses"
supports_vision = true
api_key_env = "OPENAI_API_KEY"
requires_auth = true
actor_authorization = ""
thinking_mode = "auto"
max_output_tokens = 1200
request_timeout_secs = 60
max_retries = 2

[proactive]
enabled = true
check_interval_secs = 300
inactivity_threshold_secs = 7200
cooldown_secs = 7200
push_probability_percent = 35
# 可选：部署者可在自己的运行时配置中填写 main_admin。
main_admin_decision_interval_secs = 10800
main_admin_cooldown_secs = 21600
daily_limit = 4
main_admin_daily_limit = 2
target_cooldown_secs = 21600
# 私聊：对方最近主动互动过就先不追加主动消息。
recent_interaction_cooldown_secs = 7200
# 群聊的"在场"要求：窗口内（秒）确实有人说过话、且真人消息不少于
# group_activity_min_messages 条时，芸汐才会在群里开口——随机主动消息与
# 自主续聊共用这一条判定，冷清的群不会被冷不丁打扰。她自己的主动消息
# 不计入条数。
group_activity_window_secs = 300
group_activity_min_messages = 2
# Neuro-sama 风格自主会话：宿主状态机根据已发送结果和语境决定是否继续，模型只写候选正文。
autonomous_conversation_enabled = true
autonomous_conversation_check_interval_secs = 3
# 私聊的"多想一句"窗口。宿主只有在芸汐刚发出一条以问题或未完句结尾的短回复
# 时才会登记一个后续回合（crates/yunxi-core 的 ConversationDirective），并在
# 这里配置的静默时长之后才唤醒；对方在此期间说话会取消该回合。原来的 5s/3s
# 在真实来回里几乎永远打不开，等于这个能力从没生效过；30s/8s 才是"人过了
# 一会儿又想到一句"的节奏。
autonomous_conversation_idle_secs = 30
autonomous_conversation_cooldown_secs = 8
# 群聊自主续聊更克制：等待更久，由宿主状态机根据公共语境决定是否继续；
# 群里没人说话时直接停在 Wait，不再自己把话接下去。
autonomous_conversation_group_idle_secs = 45
autonomous_conversation_group_cooldown_secs = 15
# Legacy compatibility field; retained for config compatibility, not read by the loop.
autonomous_conversation_group_max_turns = 1
# 单条入站消息之后最多连续多少次自主续聊（新入站会归零计数，私聊与群聊通用）。
# 这是防止"一直想说话"的模型把一次聊天刷成无上限的高潮并烧掉大量 token 的硬上限。
autonomous_conversation_max_turns = 2
# 私聊连续回合由宿主根据对话状态处理；模型只生成当前回合的自然正文。

[traffic]
enabled = true
window_secs = 60
per_user_limit = 20
global_limit = 300
cooldown_secs = 120
max_pending_turns = 16
max_input_chars = 6000
max_model_response_bytes = 2097152
max_model_queue = 64
model_queue_timeout_secs = 15

[group_interjection]
enabled = true
min_eligible_messages = 4
cooldown_secs = 180
response_probability_percent = 45
min_message_chars = 4
decision_cooldown_secs = 60
decision_rate_window_secs = 600
decision_rate_limit = 3
interjection_max_output_tokens = 240
direct_spam_cooldown_secs = 600
direct_rate_window_secs = 60
direct_rate_limit = 4
sticker_reaction_window_secs = 90
# 表情包回应的节流（与上面的文字插话分开计）。这三个键线上一直在用，但模板里没有：
# 它们的值与代码默认值相同，所以就算按模板重新生成配置，行为也不变——补进来是为了让
# "生产模板"真的覆盖到线上在用的键，别再出现"模板与线上对不上"的这种漂移。
sticker_reaction_cooldown_secs = 30
sticker_reaction_rate_window_secs = 300
sticker_reaction_rate_limit = 3
# 熟人放行：熟悉度 ≥ familiarity_threshold 的成员，其未点名消息确定性进入
# 语义评估（是否真的回复仍由评估模型与 Core 决定），不再只靠概率采样；
# 这是"群里有熟人在说话，她会有自然反应"的通道。familiar_rate_limit
# 是每群每窗口内进入语义评估的条数上限（模型成本护栏）。
familiar_admit_enabled = true
familiarity_threshold = 0.8
familiar_rate_window_secs = 600
familiar_rate_limit = 2
# 未点名回合的可见输出必须有 Mind 由头：Mind 判定 silent（没有要接的
# open question / agenda / interest）时，未点名的群聊消息只观察、不生成
# 回复。旧行为是"silent 只作为提示，模型自己决定接不接"——线上实测
# 2026-09-10~13：Mind 判 silent 却仍发出可见回复的有 271 条，占全部群
# 回复的 75%，是"没问她也要答"的主通道。想回到旧行为就置 false。
ambient_requires_mind_intent = true
# 对话焦点：她在群里可见回复某人之后，这个人的未点名后续算"接续"——
# 可以回，用 continuation_reply_gap_secs 那一档间隔，并且连发的几条会按
# "说完了没"合批成一轮。焦点按时间收敛（超过 continuation_focus_ttl_secs
# 就结束），或者被她下一次可见回复换成新对象；群里别人插话不影响它——
# 线上实测过"别人一说话就结束"，在活跃群里接续活不过一轮。
# 为什么需要它：@ 一次再连发几条时，后几条未点名消息 89% 连语义评估都进
# 不去，进了的也会被 90 秒未点名间隔静默（接续窗口只有 60 秒，在她能再次
# 开口之前就关了）。关掉即回到旧行为。
# 2026-09-14 15:23 的实测教训：焦点一开始做成"别人插话即结束"，结果群里 5 秒
# 后就有人插了一句闲话，用户紧接着发的那条掉回低频抽样、没有回复。
continuation_enabled = true
# 焦点存活时间（秒）：她最后一次可见回复之后多久内仍算在对话中。
continuation_focus_ttl_secs = 120
# 接续回合并**不设句数上限**：宿主只把"你已经回了 N 句"作为事实喂给模型
# （接续契约里写明"要不要继续由你判断，没有句数限制"），说不说、说几句由她
# 自己决定；真正的护栏是群聊频率上限 reply_rate_limit 与焦点存活时间。
# 曾经试过"一段对话最多回 4 句"，那是拿计数器代替判断——已经撤掉。
# 接续回合成轮前的最短停留（毫秒）。完成度判的是"这句话说完了没"，不是
# "这条请求说完了没"：分三条发一个请求时，前两条往往各自都是完整句子，
# 没有停留就会一条一轮。这个值给判为"说完"的接续消息留窗口，让紧接着的
# 下一条并进来；0 = 判完即成轮，取值受 [message_batch] max_wait_ms 封顶。
continuation_merge_dwell_ms = 2500
# 接续合批的等待上限（毫秒）：判"还没说完"时最多等她这么久，也是"一口气
# 连发几条"能并进同一轮的时间跨度（从这一批第一条算起）。与
# [message_batch] max_wait_ms 分开：那条管低频插话，这条管她正在跟人对话。
continuation_merge_wait_ms = 6000
# 接续回答的最短间隔（秒）。0 = 不受"不要每句都回"的间隔限制（仍受
# reply_rate_limit 与焦点边界约束）；要留下限就填正数，取值必须
# ≤ reply_gap_secs，超限按 reply_gap_secs 收口。
continuation_reply_gap_secs = 0
# 接续对话窗口：芸汐最近一次在本群可见回复后，未点名消息在此秒数内按
# "接续对话"语义评估（由相关性判定是否回复）；窗口外回到低频插话抽样。
# 窗口越长，群内每条消息请求模型的概率越高。
# 取值必须 ≤ reply_gap_secs：窗口比"她下次可以发言"的等待还长时，它会
# 变成常开状态，低频抽样与候选冷却全部作废（线上 43% 的未点名回复落在
# 这个窗口里）。超限不拒绝启动，只在启动时告警并按 reply_gap_secs 收口。
# 窗口内的语义评估同样占用 decision_rate_limit 额度。
continuation_window_secs = 60
# 群聊可见回复节奏的确定性硬限制（显式识图/教学/命令不受限，管理员与普通
# 成员同等受限）：同群两次可见聊天回复至少间隔 reply_gap_secs，每
# reply_rate_window_secs 内最多 reply_rate_limit 条。2026-09-14 实测：一场
# 正常来回 50 秒就把 4 条打满，之后 600 秒内连被点名的消息都会被静默；
# 抬到 10 后防刷屏仍由 reply_gap 与逐回合限流承担。
# 这是"几乎每句话她都回复"的最终兜底——无论模型想接多少，同群可见回复
# 频率都被压住。管理员豁免的是**等待间隔**（管理员发言按 0 秒间隔处理：
# 明确指令不该被"刚回过别人"挡掉），reply_rate_limit 频率上限对所有人
# 一致；名额是乐观预留的，回合最终没发出可见消息会立刻归还。
reply_gap_secs = 90
# 被明确点名/被引用的消息用更短的间隔：有人直接问她问题时，"刚回过别人"
# 不该让这个问题被静默丢掉（现场事故：@她提问，21 秒前刚回过别人，于是
# 问题永远没有回答）。放松的只是等待时长，频率上限对两条通道一致——被点名
# 通道同样会撞到 reply_rate_limit。
# 取值必须 ≤ reply_gap_secs；写成 0 或更大值会被配置校验拒绝/退回
# reply_gap_secs。
addressed_reply_gap_secs = 20
reply_rate_window_secs = 600
reply_rate_limit = 10

[memory]
# 数据库连接池：全进程共用。默认 5 条 / 等 30 秒，与一直以来的行为一致。
# 巡检报告（docs/known-issues-log-review-2026-09-12.md P0-3）记录过一次"5 条不够"的
# 饥饿：acquire 113.93 秒、提醒与 agent run 相继 pool timed out。调大之前先确认整机
# 内存余量——那次的根因是内存压力把 PG 拖慢，加并发只会让更多请求挤在慢查询上。
database_pool_max_connections = 5
# 取连接的最长等待。调小是"快速失败"：后台任务宁可早报错，也别排队 30 秒把别的任务
# 一起拖住。
database_acquire_timeout_secs = 30
# 语义召回：本机 embed 服务（tools/embed-service）同时提供嵌入与重排，地址走回环。
# 这几个键同样是"线上在用、模板缺失"的一类，值等于代码默认值，补进来只为对齐。
embedding_enabled = true
embedding_url = "http://127.0.0.1:6112"
embedding_model = "bge-small-zh-v1.5"
embedding_min_similarity_millis = 450
embedding_backfill_batch = 128
embedding_rerank_enabled = true
# 失控保护，不是管理手段。
#
# 以前这里是 1000，于是"她记不记得住"由"数到第 1000 条"决定：两张记忆表都按
# `ROW_NUMBER() > 1000` 直接 DELETE，等于按一个数字遗忘（真机上那句
# "记忆清理完成，移除 1 条，当前保留 1000 条"就是它）。
#
# 现在按 Hindsight 的思路：原始记忆是事实来源，让它**自然老去**——由
# retention_days（保留期，且高重要性记忆受保护）和去重决定去留；真正该收紧的是
# **检索层**（每次带进上下文的条数），不是存储层。这个值只在病态增长时兜底，
# 触发时会打 WARN 说明。
max_entries = 50000
retention_days = 30
episode_retention_days = 365
episode_max_per_scope = 128
episode_protected_salience = 0.7
profile_ttl_days = 90
summary_ttl_days = 30
sticker_ttl_days = 90
data_minimization = true
runtime_history_ttl_secs = 3600
max_conversation_messages = 25
max_conversation_tokens = 6000
contextual_memory_limit = 5
maintenance_interval_secs = 86400
summary_keep_recent_messages = 15
summary_max_chars = 1500
autonomous_query_enabled = true
autonomous_query_max_rounds = 2
autonomous_query_max_results = 8
autonomous_query_max_days = 3650
# 把 Core 回合写进长期记忆（默认开）：Core 是线上回复主力，但聊天记忆的写入一直只有
# V1 那条链路，Core 接管之后长期记忆停止增长，而召回又按旧的 context 前缀读——新对话
# 既不进记忆也召不回。打开后 Core 会把「对方说的 + 她回的」写成 v2 记忆，并借适配器
# 同步回旧表。关掉即立刻停写（已写入的行按 retention_days 自然老去）。
# 设计与取舍见 docs/yunxi-memory-v2-writeback.md。
core_writeback_enabled = true
# 让模型自己决定记什么（memory.remember 工具，默认开）。上面那个开关记的是"聊过
# 什么"（每个回合照抄一遍），这个记的是"她判断值得留下的事"：对方的偏好、身份细节、
# 约定。关掉只是不再提供这个工具，机械留档不受影响。
model_memory_enabled = true
# 把"读过但没回"的回合也写进长期记忆（默认开）。Core 路的写入是"投递成功才写"，
# 被抽样进语义评估、最后判沉默的回合什么都不留——她读过了（模型判定过、短期上下文
# 里也有），一小时后却像从没发生过；而没被抽样的噪声反而被 Host 观察流留了档。
# 打开后沉默回合也写一条入站行（不写回复行），语义就是"她看到过"。
silent_turn_writeback_enabled = true
# 沉默回合的重要度（0..=100，默认 15）。压得比对话行低：召回是查询驱动的，低重要度
# 让它们只在命中时才浮上来，不与真实对话抢 contextual_memory_limit 的位置。
silent_turn_importance = 15
# 同一会话每小时最多落档多少条沉默回合（默认 20）。护栏针对"接续窗口内确定性放行"：
# 热闹的群能在一小时里让大量未点名消息进入语义评估。超限只留日志、不落档。
silent_turn_hourly_limit = 20

[mind]
enabled = true
belief_enabled = true
preference_enabled = true
interest_enabled = true
curiosity_enabled = true
agenda_enabled = true
reflection_enabled = true
mind_planner_enabled = true
# disabled / shadow / active。Mind 已经过 shadow 观测，生产启用 active。
influence_mode = "active"
snapshot_timeout_ms = 75
# 新消息进入 Core 前的 Mind 确定性更新预算；超时会 fail-soft，不阻塞回复。
event_update_timeout_ms = 150
max_relevant_beliefs = 8
max_relevant_preferences = 8
max_relevant_interests = 8
max_open_questions = 6
max_agenda_items = 8
max_learned_beliefs_per_scope = 64
max_preferences = 32
max_interests = 32
max_open_questions_per_scope = 8
max_curiosity_per_person = 8
max_global_agenda = 24
max_agenda_per_person = 12
max_agenda_per_conversation = 12
agenda_half_life_hours = 24
question_cooldown_minutes = 120
conversation_end_idle_minutes = 10
reflection_min_interval_minutes = 60
