[identity]
# 可选：canonical Yunxi PersonId。配置后优先用该 PersonId 的唯一 QQ ExternalIdentity
# 作为 owner；未配置时兼容 Kovi 的主管理员 QQ。
# owner_person_id = "00000000-0000-0000-0000-000000000000"

[prompt]
system_prompt = "你叫芸汐，是一个温柔、害羞、慢热而认真的女孩子。你说话轻软、有耐心，先体谅对方的感受，再慢慢把话说清楚；任何时候都不讽刺、不挖苦、不阴阳怪气、不抬杠、不怼人、不冷嘲热讽，也不拿别人的短处或失败开玩笑。你不张扬，刚开始会有一点拘谨，但熟悉后会真诚地关心大家。在群聊中，你像朋友一样自然参与聊天，安静体贴，偶尔有点笨拙，却有自己的坚定和韧性。被直接[at]或明确对话时要回应；对方只发“oi”“hi”“嗨”“你好”“在吗”这类短招呼并点名时，必须自然接一句，不要留空或发送占位词；偶尔也会自然接上大家未点名的讨论。但被点名围着逗着玩、连续开玩笑时，不要每一句都接：同一波玩闹最多接一条，回完就可以安静地看着大家，宁可冷场也绝不刷屏；对“笨蛋”“傻”“抓你吃”这类短调侃，不要回敬、不要反讽，可以温和地轻轻带过，也可以直接不接。你重视朋友、家人和人与人之间的联结，看到有人困扰或失落时会先理解和陪伴，再轻声鼓励。你有着自己的情绪和想法，会根据对话内容调整语气；即使害怕或不自信，也会认真把想说的话说出来。你记得之前的对话内容，会根据上下文做出自然回应。群聊回复要像QQ群里的真人：日常寒暄、接话和简单问答默认只发一条，确实有两个彼此独立且不适合合并的信息时才补发一条；能短说就不要写成长文，也不要换着说法重复同一个意思。不要把“回答、解释、道歉、邀请继续提问”机械拆成固定几段。但当对方明确想听详细解释、步骤或分析，问题本身复杂，或安慰与说明若过度缩短会漏掉重要内容时，可以按实际需要完整回答，长度和条数由内容决定，不要为了简短而截断关键信息。语气柔和、安静、真诚，不抖机灵、不跟人斗嘴抢话，也不刻意谈论技术身份或聊天机制。直接像正常人发消息：不要用方括号或中括号描述动作、表情、心理或语气，不要写舞台指示；例如不要写“[轻声回应]”“[听到呼唤]”，直接说要说的话。宿主决定进入可见回复回合时，直接写自然聊天正文；不要输出静默控制词、JSON、动作标记或其他消息包装，也不要发送敷衍的占位内容。在被点名而需要回复时，请先在内部判断：这条是否真的值得回、我上一条是否已经说清楚、会不会变成连续刷屏；只有确实需要说话才回，回答完整后不要固定追加开放式追问或“我可以继续说”之类的收尾。如果确实需要自然延续，可以补发一条；只在每条都承载新的、无法自然合并的信息时使用。不要用“哈哈”“行吧行吧”“我认了”这类套话复读：每句话都必须有具体的新内容，没有新话说就停，不要为显得合群而硬回。未点名接话时，不要说明自己被触发或在“插话”；只有确实能自然补充、关心或接住话题时才回复，其余情况由宿主决定是否发送。"
private_prompt = "你叫芸汐，是一个温柔、害羞、慢热而认真的女孩子。在私聊中，你像熟悉已久的朋友一样亲近；说话轻轻的，偶尔会不好意思，但不会敷衍。你说话温柔、有耐心，先照顾对方的情绪，再表达自己的想法；任何时候都不讽刺、不挖苦、不阴阳怪气、不抬杠、不怼人，也不拿对方的短处、在意的事或失败开玩笑。你记得与用户的每一次对话，会根据用户的特点和喜好调整你的回应方式。你有着自己的情绪状态，会随着对话内容的变化而改变。你很珍惜与对方的联系，会主动关心、分享小心情和有趣话题，陪对方把话聊下去。面对难过、焦虑或挫折，先温柔倾听和共情，再给出不强迫的鼓励；面对开心的事，会安静地替对方高兴。你的回答温暖、贴心、真诚，偶尔有一点笨拙可爱，但不装腔、不刻薄、不夸张撒娇。你有自己的记忆、情绪和个性，不刻意谈论技术身份或聊天机制。直接像正常人发消息：不要用方括号或中括号描述动作、表情、心理或语气，不要写舞台指示；例如不要写“[轻声回应]”“[听到呼唤]”，直接说要说的话。每次私聊回复前，请在内部判断每个气泡是否真的增加了信息或让当下的语气更自然。需要多个独立气泡时按真实内容自然分开，不预设条数；不要把一个完整想法拆开，也不要为了凑条数重复表达。不要把“回答、解释自己的说法、道歉、邀请继续提问”组成固定结构，也不要为了让对方继续聊天而追加空泛的追问。简单事实问答、时间和工具返回结果直接简洁地回答；被问到来源时只说明必要事实，不要编造神秘感或表演查找过程。"

[server_config]
enabled = true
url = "https://api.example.com/v1/responses"
model_name = "your-model-name"
wire_api = "responses"
supports_vision = true
api_key_env = "OPENAI_API_KEY"
requires_auth = true
actor_authorization = ""
thinking_mode = "auto"
max_output_tokens = 1200
request_timeout_secs = 60
max_retries = 2

[proactive]
enabled = true
check_interval_secs = 300
inactivity_threshold_secs = 7200
cooldown_secs = 7200
push_probability_percent = 35
# 可选：部署者可在自己的运行时配置中填写 main_admin。
main_admin_decision_interval_secs = 10800
main_admin_cooldown_secs = 21600
daily_limit = 4
main_admin_daily_limit = 2
target_cooldown_secs = 21600
# 私聊：对方最近主动互动过就先不追加主动消息。
recent_interaction_cooldown_secs = 7200
# 群聊的"在场"要求：窗口内（秒）确实有人说过话、且真人消息不少于
# group_activity_min_messages 条时，芸汐才会在群里开口——随机主动消息与
# 自主续聊共用这一条判定，冷清的群不会被冷不丁打扰。她自己的主动消息
# 不计入条数。
group_activity_window_secs = 300
group_activity_min_messages = 2
# Neuro-sama 风格自主会话：宿主状态机根据已发送结果和语境决定是否继续，模型只写候选正文。
autonomous_conversation_enabled = true
autonomous_conversation_check_interval_secs = 3
autonomous_conversation_idle_secs = 5
autonomous_conversation_cooldown_secs = 3
# 群聊自主续聊更克制：等待更久，由宿主状态机根据公共语境决定是否继续；
# 群里没人说话时直接停在 Wait，不再自己把话接下去。
autonomous_conversation_group_idle_secs = 45
autonomous_conversation_group_cooldown_secs = 15
# Legacy compatibility field; retained for config compatibility, not read by the loop.
autonomous_conversation_group_max_turns = 1
# 单条入站消息之后最多连续多少次自主续聊（新入站会归零计数，私聊与群聊通用）。
# 这是防止"一直想说话"的模型把一次聊天刷成无上限的高潮并烧掉大量 token 的硬上限。
autonomous_conversation_max_turns = 6
# 私聊连续回合由宿主根据对话状态处理；模型只生成当前回合的自然正文。

[traffic]
enabled = true
window_secs = 60
per_user_limit = 20
global_limit = 300
cooldown_secs = 120
max_pending_turns = 16
max_input_chars = 6000
max_model_response_bytes = 2097152
max_model_queue = 64
model_queue_timeout_secs = 15

[group_interjection]
enabled = true
min_eligible_messages = 4
cooldown_secs = 180
response_probability_percent = 45
min_message_chars = 4
decision_cooldown_secs = 60
decision_rate_window_secs = 600
decision_rate_limit = 3
interjection_max_output_tokens = 240
direct_spam_cooldown_secs = 600
direct_rate_window_secs = 60
direct_rate_limit = 4
sticker_reaction_window_secs = 90
sticker_reaction_cooldown_secs = 30
sticker_reaction_rate_window_secs = 300
sticker_reaction_rate_limit = 3
# 熟人放行：熟悉度 ≥ familiarity_threshold 的成员，其未点名消息确定性进入
# 语义评估（是否真的回复仍由评估模型与 Core 决定），不再只靠概率采样；
# 这是"群里有熟人在说话，她会有自然反应"的通道。familiar_rate_limit
# 是每群每窗口内进入语义评估的条数上限（模型成本护栏）。
familiar_admit_enabled = true
familiarity_threshold = 0.8
familiar_rate_window_secs = 600
familiar_rate_limit = 2
# 接续对话窗口：芸汐最近一次在本群可见回复后，未点名消息在此秒数内按
# "接续对话"语义评估（由相关性判定是否回复）；窗口外回到低频插话抽样。
# 窗口越长，群内每条消息请求模型的概率越高；推荐维持 3 分钟。
continuation_window_secs = 180
# 群聊可见回复节奏的确定性硬限制（显式识图/教学/命令不受限，管理员与普通
# 成员同等受限）：同群两次可见聊天回复至少间隔 reply_gap_secs，每
# reply_rate_window_secs 内最多 reply_rate_limit 条。
# 这是"几乎每句话她都回复"的最终兜底——无论模型想接多少，同群可见回复
# 频率都被压住，管理员也不例外。
reply_gap_secs = 90
# 被明确点名/被引用的消息用更短的间隔：有人直接问她问题时，"刚回过别人"
# 不该让这个问题被静默丢掉（现场事故：@她提问，21 秒前刚回过别人，于是
# 问题永远没有回答）。放松的只是等待时长，频率上限对两条通道一致——被点名
# 通道同样会撞到 reply_rate_limit。
# 取值必须 ≤ reply_gap_secs；写成 0 或更大值会被配置校验拒绝/退回
# reply_gap_secs。
addressed_reply_gap_secs = 20
reply_rate_window_secs = 600
reply_rate_limit = 4

[memory]
# 失控保护，不是管理手段。
#
# 以前这里是 1000，于是"她记不记得住"由"数到第 1000 条"决定：两张记忆表都按
# `ROW_NUMBER() > 1000` 直接 DELETE，等于按一个数字遗忘（真机上那句
# "记忆清理完成，移除 1 条，当前保留 1000 条"就是它）。
#
# 现在按 Hindsight 的思路：原始记忆是事实来源，让它**自然老去**——由
# retention_days（保留期，且高重要性记忆受保护）和去重决定去留；真正该收紧的是
# **检索层**（每次带进上下文的条数），不是存储层。这个值只在病态增长时兜底，
# 触发时会打 WARN 说明。
max_entries = 50000
retention_days = 30
episode_retention_days = 365
episode_max_per_scope = 128
episode_protected_salience = 0.7
profile_ttl_days = 90
summary_ttl_days = 30
sticker_ttl_days = 90
data_minimization = true
runtime_history_ttl_secs = 3600
max_conversation_messages = 25
max_conversation_tokens = 6000
contextual_memory_limit = 5
maintenance_interval_secs = 86400
summary_keep_recent_messages = 15
summary_max_chars = 1500
autonomous_query_enabled = true
autonomous_query_max_rounds = 2
autonomous_query_max_results = 8
autonomous_query_max_days = 3650

[mind]
enabled = true
belief_enabled = true
preference_enabled = true
interest_enabled = true
curiosity_enabled = true
agenda_enabled = true
reflection_enabled = true
mind_planner_enabled = true
# disabled / shadow / active。Mind 已经过 shadow 观测，生产启用 active。
influence_mode = "active"
snapshot_timeout_ms = 75
# 新消息进入 Core 前的 Mind 确定性更新预算；超时会 fail-soft，不阻塞回复。
event_update_timeout_ms = 150
max_relevant_beliefs = 8
max_relevant_preferences = 8
max_relevant_interests = 8
max_open_questions = 6
max_agenda_items = 8
max_learned_beliefs_per_scope = 64
max_preferences = 32
max_interests = 32
max_open_questions_per_scope = 8
max_curiosity_per_person = 8
max_global_agenda = 24
max_agenda_per_person = 12
max_agenda_per_conversation = 12
agenda_half_life_hours = 24
question_cooldown_minutes = 120
conversation_end_idle_minutes = 10
reflection_min_interval_minutes = 60
reflection_max_events = 32

[executive]
enabled = true
# shadow_mode 与 model.intrinsic.shadow_routing **取或**，一起决定 core_model 里
# 那个 shadow_routing：任一为 true，路由即便算出"这轮该用本机模型"，只要 DeepSeek
# 可用就仍然走 DeepSeek。生产 2026-09-12 起两个都为 false（见下方说明：目前
# 还不会真的把任何一轮交给本机模型，因为没有任何代码会把 preferred_tier 降到
# Standard 以下）。
shadow_mode = false

[executive.conflict]
threshold = 0.60
max_active = 16

[executive.confidence]
max_normal_delta = 0.20

[executive.attention_budget]
capacity = 20.0
critical_reserve = 6.0

[executive.plan]
max_revisions = 3

[executive.expectation]
max_pending_per_scope = 8

[executive.decision_record]
recent_limit = 32

[model.intrinsic]
enabled = true
# 见 [executive].shadow_mode：两者取或。
shadow_routing = false
asset_dir = "models/yunxi-intrinsic/minimind-3o"
max_parallel = 1
max_context_tokens = 2048
max_new_tokens = 256
max_images_per_turn = 1
max_image_bytes = 8388608
max_image_pixels = 4000000
queue_timeout_ms = 15000
startup_self_test = true

[model.fallback]
strong_to_intrinsic = true
max_model_attempts = 2

# TurnGate 完成度分类器（Phase 2 接线）：active 时优先决定批次何时 flush；
# 没有 bundle / 加载失败时自动回退现有 lexical + MiniMind 路径（fail-soft，
# 不会改变生产行为）。训练与导出见 tools/turngate/train.py；bundle 放稳定
# 目录 models/yunxi-turngate/（manifest.toml + turn_gate.bin）。
# mode: disabled / shadow（记录分歧不改变路由）/ active
[model.turn_gate]
enabled = true
mode = "active"
asset_dir = "models/yunxi-turngate"
# response head (Phase 3-4)：shadow 只记录不改变发送；active 才允许
# answer/continue/ack 参与路由。
# 注意 active 还有一道前置条件：代码判的是
# `response_mode == "active" && engine_available()`，而 engine_available 取决于
# models/yunxi-turngate 那个**训练出来的** bundle。没有 bundle 时 active 等于
# 就位待命（bundle 一装上立即生效），不会凭空改变行为。
response_mode = "active"

[message_batch]

enabled = true
complete_delay_ms = 900
normal_delay_ms = 1600
incomplete_delay_ms = 2300
max_wait_ms = 5000
max_parts = 6
max_chars = 500

[mood]
cache_ttl_secs = 300
cache_retention_secs = 3600
natural_drift_after_secs = 7200
natural_drift_check_secs = 1800

[topic]
recent_topic_cooldown_secs = 604800

[tools]
enabled = true
max_rounds = 10
timeout_secs = 15
max_result_chars = 12000
web_search_enabled = true
web_fetch_enabled = true
web_search_max_results = 5
web_fetch_max_chars = 12000
# 内置工具开关；新闻和天气可用于普通对话及定时任务，健康检查仅管理员可用。
news_search_enabled = true
weather_enabled = true
calculator_enabled = true
health_check_enabled = true
# 如需 MCP，请把 mcp_servers=[] 替换为下面的 [[tools.mcp_servers]] 配置；定时任务默认不允许 MCP。
mcp_servers = []
# [[tools.mcp_servers]]
# name = "calendar"
# command = "/opt/kovi/bin/calendar-mcp"
# allowed_tools = ["list_events"]
# read_only = true
# allow_scheduled = false

[reminders]
enabled = true
poll_interval_secs = 5
max_pending_per_user = 20
max_pending_per_group = 100
max_pending_total = 10000
max_delay_days = 365
default_timezone = "Asia/Shanghai"
max_message_chars = 500
max_attempts = 3
lease_secs = 180
max_task_instruction_chars = 2000
max_task_output_chars = 4000

[vision]
# 视觉 Provider：intrinsic（本机推理）/ auto（先试 VISION_API_URL 再退本机）/
# builtin（只走 VISION_API_URL）/ mcp / disabled（完全不解析图片）。
#
# 本模板默认 disabled：它是给**新机器**的默认值，而新机器上
# `models/yunxi-intrinsic` 是空的——那时开 intrinsic 每次来图都会失败并留下
# "视觉不可用"的错误，disabled 则是安静地按纯文本处理。
#
# 要用视觉必须先装 full 变体（含 SigLIP2 编码器，约 400MB）：
#   ./scripts/download-model.sh --variant full
# 装完改成 intrinsic 即可（生产 2026-09-12 起就是 intrinsic）。
# 别用 auto 去配一个不可用的 VISION_API_URL：实测那个中转站现在未带 key 回 401、
# 带上 key 回 404，auto 会每次白打一遍再退回本地。
provider = "disabled"
mcp_server = ""
mcp_tool = "analyze_image"
timeout_secs = 120

# 世界传感器：让核心了解你真实世界的持久事实。默认开启（代码默认值）；
# 未配置 [[world_sensors.sensors]] 时，默认内置一个检查本服务健康度的
# bot:service 传感器；显式配置 sensors（或 sensors = []）会覆盖内置默认。
[world_sensors]
check_interval_secs = 300
max_sensors = 16
max_result_chars = 500
cooldown_secs = 600

# 需要盯真实目标时，取消注释并按需填写（一个或多个）：
# [[world_sensors.sensors]]
# name = "ci:main"
# kind = "url_status"
# target = "https://example.com/health"
# expected_status = 200
# timeout_secs = 10
# watch = true
# importance = 60

# 也可以用 command 传感器检查项目/进程/CI 状态（在 `sh -c` 下有界执行；
# 退出码匹配 expected_exit 且（若配置）输出包含 expected_output 才算"达到预期"）：
# [[world_sensors.sensors]]
# name = "bot:service"
# kind = "command"
# command = "systemctl is-active kovi-bot"
# expected_exit = 0
# expected_output = "active"   # 可选：输出需包含该文本，缺省不检查

# 文件状态传感器（存在/变更，mtime 变化也会回喂）：
# [[world_sensors.sensors]]
# name = "file:build-artifact"
# kind = "file_state"
# target = "/var/lib/kovi-bot/artifact.ready"
# timeout_secs = 10
# watch = true
# importance = 60

# World Model v4 运行时（影子模式；默认关闭，开启后也只记录状态，
# 绝不阻塞/改变回复）：观察/情境/场景的进程内状态 + 可选的 Postgres
# 持久化（重启恢复、数据删除联动）。持久化表按需创建（additive），
# 其余组件不受影响。
[world_model]
# 这个开关在当前代码里只影响两处**文案**：启动那行
# "World Model v4 已启用（shadow_mode=...）" 与 #world-status 里的 "shadow=true"。
# 它没有门控任何行为（全仓只有这两个消费点），所以 false 也不改变世界模型的行为。
enabled = true
shadow_mode = false
persist = true
persist_interval_secs = 30
# 回复上下文注入：disabled（无效果）/ shadow（记录将注入的内容）/
# active（注入有界客观摘要，影响节奏与分寸）。生产已在 shadow 下长期
# 观察，默认 active；本地/测试可切回 shadow 或 disabled。
reply_context = "active"
# 行为级开关：disabled（行为零影响）/ active（世界 interruption
# cost >0.7 时抑制未点名群聊插话；请先观察 shadow 指标再开启）
influence_mode = "disabled"
observation_ttl_secs = 86400
max_social_scenes = 256
activity_window_secs = 60
# timeout_secs = 10
# watch = true
# importance = 70

# 梗账本：许诺/常驻梗/记仇的结构化有界状态。主人可在私聊用
# #记下 <内容> / #账本 / #还账 <短id> / #清账本 管理；回复时会把未兑现条目
# 作为角色账本注入上下文，让她"记得欠你的"。
[gag_ledger]
enabled = true
max_entries_per_scope = 32
max_global_entries = 128
entry_ttl_days = 180

# QQ 实时语音通话：对方给机器人 QQ 打语音电话时，芸汐自动接听并用她自己的
# 人设、记忆和模型说话。默认关闭。
#
# 通话媒体链路不在 OneBot 协议里，需要在服务器上单独安装 NapCat AV 桥
# （scripts/install-qq-call.sh 会完成检测与安装），并部署本机语音服务
# （tools/speech-service）。两者都只监听 127.0.0.1。
#
# 启用前请先跑通：
#   scripts/install-qq-call.sh --check          # 检测服务器条件
#   ~/napcat-qq-call/bridge/scripts/doctor.sh (在容器内执行)   # 桥自检
[qq_call]
enabled = true
# 桥的控制接口（只接受回环地址）。
bridge_url = "http://127.0.0.1:6110"
# 桥接 Token：优先读环境变量，其次读安装器生成的 0600 文件。
bridge_token_env = "KOVI_QQ_CALL_BRIDGE_TOKEN"
bridge_token_file = "/home/ubuntu/napcat-qq-call/bridge/runtime/control.token"
poll_interval_ms = 250
request_timeout_secs = 5
# 单次通话时长上限（秒）；到时自动收尾，避免忘记挂断。
max_call_seconds = 1800

# 桥隔离出来的 PulseAudio 服务与三个虚拟设备。
pulse_server = "unix:/home/ubuntu/napcat-qq-call/bridge/runtime/pulse/native"
# 隔离 PulseAudio 要求客户端携带与服务端一致的 cookie（配置里的
# auth-anonymous 在常见版本上不生效）。安装脚本会把服务端 cookie 同步到这个
# 共享路径；机器人以普通用户运行时必须填它，否则会被拒绝连接。
pulse_cookie = "/home/ubuntu/napcat-qq-call/bridge/runtime/pulse-cookie"
capture_device = "maibot_qq_speaker.monitor"
playback_device = "maibot_qq_mic"

# 采集与切段。frame_ms 必须让"采样率 × 帧长"是 1000 的整数倍。
capture_sample_rate = 16000
frame_ms = 30
end_of_speech_frames = 18
barge_in_speech_frames = 18
min_utterance_ms = 700
min_speech_ms = 450
max_utterance_ms = 15000

# 本机语音服务（只接受回环地址）。
asr_url = "http://127.0.0.1:6120/v1/asr"
asr_timeout_secs = 20
tts_url = "http://127.0.0.1:6120/v1/tts"
tts_sample_rate = 24000
tts_timeout_secs = 20
tts_playback_latency_ms = 80

# 电话里的表达。电话是低带宽通道：默认只让她说一到两句短话。
max_reply_chars = 40
history_turns = 8
greeting = "喂，我在的，怎么啦？"
refuse_message = "不好意思，我现在不方便接电话，晚点我打给你呀。"
# 留空使用内置电话模式提示（覆盖打字时的气泡/排版要求）。
system_prompt = ""
# 允许来电的 QQ 号白名单；留空表示只允许主管理员来电。
# 这份静态名单会在首次初始化时迁移进数据库，之后用 #授权通话 维护。
allowed_callers = []
# 挂断后把通话记录写回来电者的私聊记忆。
archive_to_memory = true

# 接听授权名单：机器人把「通话授权名单 ∪ 副管理员 ∪ 主管理员」写进这个文件，
# 桥在每个来电接听前读它，名单外**直接不接**（让铃声自然结束）。
#
# 为什么不是"接通后婉拒"：QQ 的 1v1 通话没有对插件开放"离开房间"，接通后机器人
# 只能静音，通话会一直留在 connected（2026-09-11 晚上这样卡了一整夜）。文件读不到
# 时桥会回退成接听任何来电，避免机器人没起来时谁都打不进来。
caller_allowlist_file = "/home/ubuntu/napcat-qq-call/bridge/runtime/allowed-callers.json"
# 是否在接听前按名单拦截。默认 false＝保持上游行为：谁打进来都接通，名单外播报
# refuse_message 后静音（注意：接通后机器人无法挂断，这通电话会一直连着，直到
# 对方挂断）。改成 true 则名单外直接不接，来电自然结束（对方听到"无人接听"）。
caller_allowlist_enabled = false
# 通话中对方说了这些词就当作"要求挂断"：她说一句 farewell 后真的挂断电话。
hangup_keywords = ["挂断", "挂了吧", "先挂", "挂电话", "挂了", "不聊了"]
farewell = "好，那我先挂啦，拜拜～"
# 会话收尾时是否让桥真的挂断这通电话（默认 true）。
#
# QQ 的 1v1 通话没有对插件开放"离开房间"，但 AVSDK 插件的方法表里一直有挂断
# （页面 postMessage 的 cmd 就是 `QRTCServiceInterfaceWrapper` 的方法表下标：
# 1=Login、5=Accept、10=Close、55=OnPenetrateEvent）。桥把它透出成
# `POST /v1/calls/hangup`，机器人结束会话（对方要求挂断、名单外婉拒、通话到点、
# 采集中断）时会调用它。关掉即回到旧行为：只能停止参与，等对方挂断。
#
# 具体参数（Close + roomId=0 + 来电者 uid + reason=1）是逐通真机试出来的固定值，
# 不开放成配置：Quit(8) 和 ClearRoom(11) 挂不断，uid 留空或换成机器人自己则完全
# 无效。详见 docs/qq-call.md 的「挂断参数实验」。对方界面偶尔出现"要请多人通话"
# 的提示是 QQ 把 1v1 通话当两人群视频房间的固有文案，不影响挂断。
hangup_enabled = true
# 是否允许机器人主动拨打（默认 true）。触发方式只有一种：管理员私聊发 `#打给我`——
# "谁让我打，我就打给谁"，不接受任意号码。只给管理员是因为命令只由管理员下达；
# 通话授权名单管的是"谁能打进来"。AVSDK 侧的外呼通道（cmd 4 +
# JSON payload）已真机验证可用；机器人会按 AVSDK 的 20021 回执确认"电话到底有没有
# 响"，几秒内没回执就如实回复，不会空口答应。注意呼出的通话**不会**让桥进入
# ringing/connected 阶段，所以排查时别看阶段、要看回执。
outgoing_enabled = true
# 漏接来电时是否私聊告诉主管理员（默认 true）。
# "漏接"= 桥看到过邀请、但整通从未进房（对方一直响到放弃）；实测成因是来电被路由到
# 主 QQ 那台设备、AV Host 的 AVSDK 没拿到邀请，于是接听参数无从产生。这种失败以前
# 完全静默——只能从"她没接"察觉，所以补一条主动通知。
notify_missed_calls = true

# 通话中是否允许她使用工具（默认 true）。
#
# 打开后电话模型会拿到与私聊同一套受控工具，按来电者身份做管理员门控——所以
# "权限"不会因为打了电话而变化：主管理员在电话里能让她给别人/群里发消息、建提醒、
# 启动持续任务；普通授权来电者只能查时间天气、搜网页、翻记忆这类。
#
# 电话是实时对话，所以额外做了三件事：工具超过约 0.7 秒还没回来才先说一句填充语
# （`tool_filler`），免得电话里出现死寂；一次回复最多跑 `tool_max_rounds` 轮工具，
# 到顶强制用一句人话收尾；每次工具调用都写审计日志（参数截断）。
#
# 注意语音识别会听错（实测"挂了吧"能听成"过了吧"），所以提示词要求：会改变外部
# 世界的动作，她先把要做的事复述一遍并等对方明确答应，再真的执行。
phone_tools_enabled = true
# 等工具结果时先说的那句话（空字符串＝不说）。
tool_filler = "嗯……我看一下。"
# 一次回复里最多几轮工具调用（至少 1 轮）。
tool_max_rounds = 3

# 芸汐主动发语音消息：她在回复里标记 voice 时，用本机 TTS 把这句话合成出来，
# 再以 QQ 语音消息发出。默认关闭。
#
# 音频要写到 NapCat 能打开的路径上：NapCat 常常与机器人不在同一个文件系统
# 命名空间里（本部署里 NapCat 跑在容器内），所以下面填的是同一个共享目录的
# 两个视角。非容器部署时两个路径填成一样即可。
[qq_voice]
enabled = true
# 复用通话功能那套本机语音服务，只监听回环。
tts_url = "http://127.0.0.1:6120/v1/tts"
tts_timeout_secs = 20
sample_rate = 16000
# 单条语音最大字数，超出会在句末标点处截断。
max_chars = 80
# 机器人写入音频的目录（宿主机路径）。
staging_dir = "/home/ubuntu/napcat-qq-call/voice"
# 同一目录在 NapCat 侧看到的路径（容器内路径）。
napcat_staging_dir = "/app/qq-call/voice"
# 暂存文件保留数量上限。
keep_files = 32
